name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where most users install; Python 3.10 is the documented minimum.
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (first run, incremental index, release ZIP included)
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Release ZIP
        run: python -X utf8 tools/check_release_zip.py
